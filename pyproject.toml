[project]
name = 'pulse_transitions'
version = "0.3.0"
authors = [{ name = "Simon Hobbs", email = 'simon.hobbs@electrooptical.net' }]
requires-python = '>=3.10'
classifiers = [
	'Development Status :: 2 - Pre-Alpha',
	'Intended Audience :: Developers',
	'Natural Language :: English',
	'Programming Language :: Python :: 3',
	'Programming Language :: Python :: 3.10',
	'Programming Language :: Python :: 3.11',
	'Programming Language :: Python :: 3.12',
	'Programming Language :: Python :: 3.13',
]
description = "Pulse and transition metrics (IEEE Std 181-2003) with a MATLAB-named interface"
keywords = []
readme = "README.md"
dependencies = ["numpy>=1.24"]
license = "LGPL-2.1-only"
license-files = ["LICENSE"]

[project.optional-dependencies]
examples = ["matplotlib>=3.7", "scipy>=1.10"]
test = ["pytest>=7", "ruff>=0.14", "pulse_transitions[examples]"]  # the examples smoke test runs them

[project.urls]
github = 'https://github.com/snhobbs/pulse_transitions'

[tool.setuptools.packages.find]
where = ['src']

[tool.setuptools.package-data]
pulse_transitions = ["py.typed"]

[build-system]
requires = ["setuptools>=77"]  # for the license expression above (PEP 639)
build-backend = "setuptools.build_meta"


# ==== pytest ====
[tool.pytest.ini_options]
minversion = "7.0"
python_files = ["tests.py", "test_*.py"]
pythonpath = ["src"]

# ==== Coverage ====
[tool.coverage.run]
include = ["src/**"]
omit = ["*/tests/*"]

# ==== mypy ====
[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true


# ==== ruff ====
[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py310"  # matches requires-python
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = [
	"F",    # pyflakes
	"E",    # pycodestyle errors
	"W",    # pycodestyle warnings
	"I",    # isort
	"B",    # bugbear
	"UP",   # pyupgrade
	"C4",   # comprehensions
	"SIM",  # simplifications
	"NPY",  # numpy-specific
	"PT",   # pytest style
	"RUF",  # ruff-specific
]
ignore = [
	"C408",    # dict(color=..., ...) reads better than a literal for matplotlib keyword sets
	"E501",    # line length is the formatter's job; long strings and comments are allowed
	"PT009",   # the tests use unittest assertions
	"PT027",   # and unittest's assertRaises
	"RUF001",  # ambiguous unicode in strings: the plots use σ, τ, ω, ±, ×
	"RUF002",  # ... and docstrings
	"RUF003",  # ... and comments
]

[tool.ruff.lint.isort]
known-first-party = ["pulse_transitions", "_plot", "tests"]

# ==== Formatting ====
# Style: `ruff format` (Black-compatible) at the 88-column line-length above, the same as
# the sibling labcore projects. `make format` applies it; `make lint` (and CI) checks it.
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true  # format the worked examples in docstrings too

[tool.ruff.lint.per-file-ignores]
"benchmarks/*" = ["B023"]  # each lambda is timed inside its own loop iteration
"tests/*" = ["SIM117"]  # subTest wrapping assertRaises reads clearer nested
